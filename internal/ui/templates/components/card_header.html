{{define "card-header"}}
<div class="flex items-center justify-between gap-4 border-b border-line bg-linear-to-r from-white to-sky-50/50 px-5 py-4 sm:px-6">
  <div>
    <p class="text-[11px] uppercase tracking-[0.08em] font-medium text-slate-500 mb-[2px]">{{.Cat}}</p>
    <h3 class="text-[16px] font-bold text-slate-900">{{.Title}}</h3>
  </div>
  <span class="shrink-0 rounded-full border border-sky-100 bg-sky-50 px-2.5 py-1 text-[11px] font-bold text-sky-700">{{.Badge}}</span>
</div>
{{end}}
