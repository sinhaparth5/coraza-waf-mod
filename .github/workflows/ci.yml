name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PACKAGE_NAME: palisade-waf
  GO_VERSION: '1.27.x'
  GOLANGCI_LINT_VERSION: 'v2.14.0'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate embedded assets
        run: go generate ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      # Backs the Redis rate-limit backend and blocklist cluster-sync tests,
      # which skip themselves when TEST_REDIS_ADDR is unset (local runs).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate embedded assets
        run: go generate ./...

      - name: Run tests
        env:
          TEST_REDIS_ADDR: 127.0.0.1:6379
        # -coverpkg credits code to its own package wherever it runs, e.g.
        # storage queries exercised by the admin UI tests.
        # gotestsum wraps go test to also write JUnit XML for Codecov Test Analytics.
        run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sinhaparth5/palisade-waf

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: junit.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sinhaparth5/palisade-waf

  test-external-db:
    name: Test (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - driver: mysql
            dsn: 'root:test@tcp(127.0.0.1:3306)/'
          - driver: postgres
            dsn: 'postgres://postgres:test@127.0.0.1:5432/coraza_test?sslmode=disable'
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        # MySQL's entrypoint runs a temporary server for init scripts, shuts
        # it down, then restarts as the real server — mysqladmin ping can
        # succeed against that temporary instance, a false-positive matching
        # docker-compose.test.yml's own header comment about the same
        # ~20-25s two-phase startup. health-start-period + health-retries
        # give the real server time to come up before any step that depends
        # on `services.mysql` runs.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot 2>/dev/null || exit 1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
        # mysql:8 has no MYSQL_DATABASE env — internal/storage/testdb_test.go's
        # createTestDatabase creates its own uniquely-named database per test
        # via an admin DSN with no database selected.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: coraza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate embedded assets
        run: go generate ./...

      - name: Run internal/storage tests against ${{ matrix.driver }}
        env:
          TEST_DB_DRIVER: ${{ matrix.driver }}
          TEST_DB_DSN: ${{ matrix.dsn }}
        run: go run gotest.tools/gotestsum@v1.13.0 --format standard-verbose --junitfile junit.xml -- -covermode=atomic -coverprofile=coverage.out ./internal/storage/...

      # Merged with the unit upload by Codecov, so dialect branches that only
      # run against MySQL/Postgres count toward storage coverage too.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          flags: ${{ matrix.driver }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sinhaparth5/palisade-waf

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: junit.xml
          flags: ${{ matrix.driver }}
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sinhaparth5/palisade-waf

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test, test-external-db]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build release artifacts
        run: |
          make dist VERSION="${GITHUB_REF_NAME}"
          make checksums

      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="release-notes.md"
          changelog_file="release-changelog.md"

          # CHANGELOG.md holds only [Unreleased] plus the most recent release
          # (see scripts/roll-changelog.sh). `make tag` promotes Unreleased
          # into the version section before tagging, so that heading is what
          # is normally read here; a tag pushed by hand skips that roll, so
          # fall back to [Unreleased], which still holds the same notes.
          #
          # Stopping at the trailing "[x]: https://..." link block matters
          # now that the release section is the last one in the file — before
          # trimming, the next "## [" heading always ended the scan first.
          #
          # Matched with index() on literal strings rather than regexes: the
          # heading contains "[", "]" and ".", and a regex for it has to be
          # escaped twice — once for the shell and once more because awk -v
          # processes escape sequences in the assignment itself. Getting that
          # wrong is silent and total: "\[1\.9\.0\]" arrives at awk as
          # "[1.9.0]", which is a character class, so the heading never
          # matches and the release ships with placeholder notes.
          extract_section() {
            awk -v prefix="$1" '
              index($0, prefix) == 1            { capture = 1; next }
              capture && index($0, "## [") == 1 { exit }
              capture && index($0, "[") == 1    { exit }
              capture                           { print }
            ' CHANGELOG.md
          }

          extract_section "## [${version}]" > "$changelog_file"
          if ! grep -q '[^[:space:]]' "$changelog_file"; then
            extract_section "## [Unreleased]" > "$changelog_file"
          fi

          {
            if [ -s "$changelog_file" ]; then
              sed '/^[[:space:]]*$/d' "$changelog_file"
            else
              echo "Release notes were not found in CHANGELOG.md for ${GITHUB_REF_NAME}."
              echo
              echo "Write the changes under ## [Unreleased] and cut the release with"
              echo "\`make tag VERSION=${GITHUB_REF_NAME}\`, which promotes that section to"
              echo "## [${version}] and tags the result, so these notes are filled in automatically."
            fi

            cat <<EOF | sed 's/^          //'

          ## Install (Linux)

          \`\`\`bash
          curl -fsSL https://waf-install.astrareconslabs.com/palisade-waf/install.sh | sudo bash
          \`\`\`

          Pin to this exact version:
          \`\`\`bash
          curl -fsSL https://waf-install.astrareconslabs.com/palisade-waf/install.sh | sudo PALISADE_VERSION=${GITHUB_REF_NAME} bash
          \`\`\`

          Re-running the installer is safe. It upgrades the binary and restarts the service without touching your existing config or database.

          ## Docker

          \`\`\`bash
          docker run -d --name palisade -p 8080:8080 -v coraza-waf-data:/data ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}
          \`\`\`

          Multi-arch (linux/amd64, linux/arm64). Persistent state (\`waf.db\`, \`certs/\`) lives under \`/data\` — mount a volume there. Also published to Docker Hub.

          ## Verify checksums

          \`\`\`bash
          sha256sum --check checksums.txt
          \`\`\`

          ## What's inside the binary

          Everything is embedded, so no external files are needed at runtime:
          - Admin UI (HTMX + Tailwind templates + minified JS)
          - Bundled GeoLite2 Country database (geo blocking)
          - Bundled DB-IP ASN Lite database (ISP/org lookup)
          - OWASP Core Rule Set (WAF rules)

          The only files created on disk at runtime are \`waf.db\` (SQLite) and \`certs/\` (TLS, if enabled).
          EOF
          } > "$notes_file"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Palisade ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/${{ env.PACKAGE_NAME }}-linux-amd64
            dist/${{ env.PACKAGE_NAME }}-linux-arm64
            dist/${{ env.PACKAGE_NAME }}-windows-amd64.exe
            dist/checksums.txt

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, test, test-external-db]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags are computed in plain shell from the tag ref rather than
      # docker/metadata-action: the action fetches repo metadata from the
      # GitHub REST API to build its default OCI labels, which made this
      # step fail on GitHub API outages (v1.6.0's first release attempt died
      # twice on a 503 "Unicorn" page here) even though everything it
      # produced — "<semver> without the v" + "latest", and labels — is
      # derivable locally from the event context with no network call.
      - name: Compute image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "tags<<EOF"
            for image in \
              "ghcr.io/${{ github.repository }}" \
              "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PACKAGE_NAME }}"; do
              echo "${image}:${VERSION}"
              echo "${image}:latest"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ env.PACKAGE_NAME }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
