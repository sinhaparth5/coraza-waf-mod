name: govulncheck

# Fails when Palisade's code actually reaches a known vulnerability in a
# dependency or the Go standard library. The weekly run catches advisories
# published after the last push; GitHub emails the failure to the maintainer.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Same Go as the release builds in ci.yml, so stdlib findings match
      # what actually ships.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - name: Generate embedded assets
        run: go generate ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
